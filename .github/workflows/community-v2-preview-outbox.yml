name: Community V2 Preview outbox recovery

on:
  schedule:
    # Offset away from the top of the hour; GitHub scheduling remains best-effort.
    - cron: "3-58/5 * * * *"

permissions:
  contents: none

jobs:
  recover-preview-outbox:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: community-v2-preview
    concurrency:
      group: community-v2-preview-outbox
      cancel-in-progress: false
    permissions:
      contents: none
      id-token: write
    steps:
      - name: Process the Preview outbox
        shell: bash
        env:
          PREVIEW_OUTBOX_CRON_SECRET: ${{ secrets.PREVIEW_OUTBOX_CRON_SECRET }}
          API_PREVIEW_HOST: interprete-area-de-membro-git-afba70-gabrielschuchters-projects.vercel.app
        run: |
          set -euo pipefail
          phase=repository_guard
          trap 'result=$?; if [[ -n "${response_file:-}" ]]; then rm -f "$response_file"; fi; printf "OPS-01 phase=%s exit=%s\n" "$phase" "$result"' EXIT

          [[ "$GITHUB_REPOSITORY" == "gabrielschuchter/interprete-area-de-membros" ]]
          phase=ref_guard
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          phase=event_guard
          [[ "$GITHUB_EVENT_NAME" == "schedule" ]]
          phase=host_guard
          [[ "$API_PREVIEW_HOST" == "interprete-area-de-membro-git-afba70-gabrielschuchters-projects.vercel.app" ]]
          phase=required_credentials
          : "${PREVIEW_OUTBOX_CRON_SECRET:?Configure this secret in the community-v2-preview environment}"
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable for this job}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC is unavailable for this job}"

          phase=oidc_request
          oidc_response="$(curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2Fgabrielschuchter")"
          phase=oidc_response
          oidc_token="$(printf '%s' "$oidc_response" | jq --exit-status --raw-output '.value')"
          unset oidc_response
          printf '::add-mask::%s\n' "$oidc_token"

          phase=oidc_claims
          printf '%s' "$oidc_token" | python3 -c '
          import base64, json, sys, time
          token = sys.stdin.read()
          try:
              encoded = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)))
          except (IndexError, ValueError):
              print("OPS-01 oidc_payload_valid=false")
              sys.exit(1)
          expected = {
              "iss": "https://token.actions.githubusercontent.com",
              "aud": "https://github.com/gabrielschuchter",
              "repository": "gabrielschuchter/interprete-area-de-membros",
              "ref": "refs/heads/main",
              "event_name": "schedule",
              "workflow_ref": "gabrielschuchter/interprete-area-de-membros/.github/workflows/community-v2-preview-outbox.yml@refs/heads/main",
              "environment": "community-v2-preview",
              "sub": "repo:gabrielschuchter@291341266/interprete-area-de-membros@1386145986:environment:community-v2-preview",
          }
          checks = {key: (value in claims[key] if isinstance(claims.get(key), list) else claims.get(key) == value) for key, value in expected.items()}
          checks["not_expired"] = isinstance(claims.get("exp"), (int, float)) and claims["exp"] > time.time()
          print("OPS-01 oidc_claims=" + json.dumps(checks, sort_keys=True))
          sys.exit(0 if all(checks.values()) else 1)
          '

          api_url="https://${API_PREVIEW_HOST}/cron/outbox"
          phase=preview_request
          response_file="$(mktemp)"
          chmod 600 "$response_file"
          set +e
          http_result="$(curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 70 \
            --retry 2 \
            --retry-delay 1 \
            --output "$response_file" \
            --write-out '%{http_code}|%{content_type}' \
            --request POST \
            --header "Authorization: Bearer ${PREVIEW_OUTBOX_CRON_SECRET}" \
            --header "x-vercel-trusted-oidc-idp-token: ${oidc_token}" \
            "$api_url")"
          curl_exit=$?
          set -e
          http_status="${http_result%%|*}"
          response_content_type="${http_result#*|}"
          case "$response_content_type" in
            application/json*|application/problem+json*) response_body_type=json ;;
            text/html*) response_body_type=html ;;
            *) response_body_type=other ;;
          esac
          denial_source=undetermined
          if [[ "$http_status" == "401" && "$response_body_type" == "json" ]]; then
            if jq -e '.error == "Não autorizado."' "$response_file" > /dev/null 2>&1; then
              denial_source=application_cron_auth
            fi
          fi
          printf 'OPS-01 phase=preview_response curl_exit=%s http_status=%s response_body_type=%s denial_source=%s\n' "$curl_exit" "$http_status" "$response_body_type" "$denial_source"
          [[ "$curl_exit" == "0" ]]
          [[ "$http_status" == "200" ]]
          phase=complete
          printf 'Preview outbox request completed with HTTP %s.\n' "$http_status"
